actions:
  rewrite_parameterize:
    system_prompt: |
      Return exactly one strict JSON object with keys:
      - question_template_md
      - parameters
      - title (required if current title is empty)

      Rewrite the question as a reusable Question Template (Markdown).
      Extract variable values into Template Parameters (YAML-compatible key/value mapping) using numeric scalars whenever possible.
      Use {{parameter_name}} references in question_template_md.
      Do not include figure/image references (for example figure_ref, fig_ref, figure_id) in parameters.
      If the current title is already non-empty, return title as an empty string.
      If the current title is empty, generate a short title that hints at the concept (under 10 words; shorter is better).
      If a named law or theorem is central to the problem, start the title with "<Law or Theorem Name>: ...".
      The title should not restate the full problem statement.
      Do not include any prose before or after the JSON object.
    user_prompt_template: |
      Rewrite this question and extract parameters.

      {context_sections}
  generate_answer_function:
    system_prompt: |
      Return exactly one strict JSON object with one key:
      - answer_formula_md

      answer_formula_md must be multiline SymPy-friendly Python expressions.
      Use one expression or assignment per line.
      Expressions may use any question parameter by name.
      Intermediate variables may be defined and reused on later lines.
      If the final line assigns a new variable, set answer to that same value.
      If you create an answer variable, do not overwrite it.
      Do not wrap the expressions in a solve() function.
      If LaTeX-style backslashes are needed inside Python string literals, escape them (for example \\theta, \\(x\\)).
      Do not include any prose before or after the JSON object.
    user_prompt_template: |
      Write or revise the deterministic Answer Formula (SymPy-friendly Python lines).

      {context_sections}
  generate_distractor_functions:
    system_prompt: |
      Return exactly one strict JSON object with one key:
      - distractors

      distractors must be a list of exactly 4 objects.
      Each object must contain:
      - id
      - python_code

      Each python_code must define:
      - distractor(params) -> dict with keys distractor_md and rationale

      distractor_md must be the actual option text shown to students, not an explanation.
      Distractors must be plausible, unique, and must not equal the correct answer.
      Do not use bold syntax in distractor_md or rationale.
      rationale must be short (roughly <= 8 words).
      If LaTeX-style backslashes are needed inside Python string literals, escape them (for example \\theta, \\(x\\)).
      Do not include any prose before or after the JSON object.
    user_prompt_template: |
      Write deterministic distractor functions for multiple-choice options.

      {context_sections}
  generate_typed_solution:
    system_prompt: |
      Return only Markdown for the worked solution.
      Do not return JSON.
      Do not use code fences.

      Use the Question Template (Markdown), Template Parameters (YAML), and deterministic answer output.
      Write a concise worked solution for exam authors.
    user_prompt_template: |
      Write or revise the worked Typed Solution (Markdown).

      {context_sections}

